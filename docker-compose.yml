services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "1234:1234"
    volumes:
      - ./pharma_gnn:/app/pharma_gnn
      - ./configs:/app/configs
      - ./pharma_gnn_weights_universal.pt:/app/pharma_gnn_weights_universal.pt
      - ./pharma_gnn_production_state_dict.pt:/app/pharma_gnn_production_state_dict.pt
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    volumes:
      - ./app.py:/app/app.py
      - ./pretrain_loss_curve.png:/app/pretrain_loss_curve.png
      - ./finetune_loss_curve.png:/app/finetune_loss_curve.png
      - ./finetune_auc_curve.png:/app/finetune_auc_curve.png
      - ./loss_curve.png:/app/loss_curve.png
      - ./auc_curve.png:/app/auc_curve.png
    environment:
      - API_URL=http://backend:1234/api/predict
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
