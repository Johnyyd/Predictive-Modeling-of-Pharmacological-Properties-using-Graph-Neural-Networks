services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "1234:1234"
    volumes:
      - ./pharma_gnn:/app/pharma_gnn
      - ./configs:/app/configs
      - ./pharma_gnn_weights_universal.pt:/app/pharma_gnn_weights_universal.pt
      - ./pharma_gnn_production_state_dict.pt:/app/pharma_gnn_production_state_dict.pt
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    volumes:
      - ./app.py:/app/app.py
      - ./pretrain_loss_curve.png:/app/pretrain_loss_curve.png
      - ./finetune_loss_curve.png:/app/finetune_loss_curve.png
      - ./finetune_auc_curve.png:/app/finetune_auc_curve.png
      - ./loss_curve.png:/app/loss_curve.png
      - ./auc_curve.png:/app/auc_curve.png
    environment:
      - API_URL=http://backend:1234/api/predict
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend

  tailscale-frontend:
    build:
      context: ./tailscale
      dockerfile: Dockerfile.tailscale
    container_name: pharmagraph
    hostname: pharmagraph
    restart: always
    environment:
      - TS_AUTHKEY=tskey-auth-kMvFmVxPpg11CNTRL-dWkCF7p8tLFLXHhgSqzsKFc5bp7aHEYf
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_TARGET_HOST=frontend
      - TS_TARGET_PORT=8501
      - TS_FUNNEL_PORT=443
    volumes:
      - ts_frontend_state:/var/lib/tailscale
    depends_on:
      - frontend

  # Tailscale Public Proxy for Backend (Johnyyd/tailscale_public_url pattern)
  tailscale-backend:
    build:
      context: ./tailscale
      dockerfile: Dockerfile.tailscale
    container_name: pharmagraph-ts
    hostname: pharmagraph-ts
    restart: always
    environment:
      - TS_AUTHKEY=tskey-auth-kMvFmVxPpg11CNTRL-dWkCF7p8tLFLXHhgSqzsKFc5bp7aHEYf
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_TARGET_HOST=backend
      - TS_TARGET_PORT=1234
      - TS_FUNNEL_PORT=7443
    volumes:
      - ts_backend_state:/var/lib/tailscale
    depends_on:
      - backend

volumes:
  ts_frontend_state:
  ts_backend_state:

